# Juvay — Nginx (source of truth for /opt/juvay)
# HTTP → HTTPS 308, HSTS, www and apex must not split.
# /api → Node on :3001 (server/index.js). Legal HTML is real files, not the SPA shell.

# HTTP apex + www → HTTPS apex
server {
    listen 80;
    listen [::]:80;
    server_name juvay.app www.juvay.app;
    return 308 https://juvay.app$request_uri;
}

# HTTPS www → HTTPS apex (no split)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.juvay.app;

    # Certbot / existing certs — paths as used on trini for juvay.app
    ssl_certificate     /etc/letsencrypt/live/juvay.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/juvay.app/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 308 https://juvay.app$request_uri;
}

# HTTPS apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name juvay.app;

    ssl_certificate     /etc/letsencrypt/live/juvay.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/juvay.app/privkey.pem;

    root /opt/juvay/dist;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Same-origin API only. Do not list api.juvay.app (NXDOMAIN) or wefetepass.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.wamnow.com https://pay.wamnow.com; frame-src 'self' https://*.wamnow.com https://pay.wamnow.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    # No paypal.com. Paid rail is Wam (fail-closed) or cash pickup / COD.

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Same-origin API — Node on :3001. Live today only /api/wam/ is proxied;
    # /api and /api/ (no trailing-path) must hit Node or GET /api/ is the SPA shell.
    # Do not invent api.juvay.app DNS.
    location = /api  { proxy_pass http://127.0.0.1:3001; proxy_http_version 1.1; proxy_set_header Host $host; }
    location = /api/ { proxy_pass http://127.0.0.1:3001; proxy_http_version 1.1; proxy_set_header Host $host; }
    location = /api/signup { proxy_pass http://127.0.0.1:3001; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /api/auth/signup { proxy_pass http://127.0.0.1:3001; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /api/login  { proxy_pass http://127.0.0.1:3001; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /api/health { proxy_pass http://127.0.0.1:3001; proxy_http_version 1.1; proxy_set_header Host $host; }
    location /api/auth/    { proxy_pass http://127.0.0.1:3001; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /api/stores   { proxy_pass http://127.0.0.1:3001; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; proxy_set_header X-Forwarded-Proto $scheme; }
    location /api/products { proxy_pass http://127.0.0.1:3001; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; proxy_set_header X-Forwarded-Proto $scheme; }
    location /api/wam/     { proxy_pass http://127.0.0.1:3001; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Wam-Signature $http_x_wam_signature; }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        client_max_body_size 10M;
    }

    location /uploads/ {
        alias /opt/juvay/uploads/;
        expires 7d;
    }

    # Distinct static legal files (not the 1504 B SPA shell)
    location = /terms          { try_files /terms.html =404; }
    location = /privacy        { try_files /privacy.html =404; }
    location = /refund         { try_files /refund.html =404; }
    location = /legal/terms    { try_files /terms.html =404; }
    location = /legal/privacy  { try_files /privacy.html =404; }
    location = /legal/refund   { try_files /refund.html =404; }
    location = /legal/merchant-agreement { try_files /merchant-agreement.html =404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
