<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Juvay — the Caribbean's premier commerce platform for stores, services, rides, jobs, real estate, and events" />
  <meta name="keywords" content="Caribbean business, Trinidad marketplace, TT stores, Caribbean ecommerce, Juvay, Trinidad services, Tobago" />
  <meta name="author" content="Juvay" />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <link rel="canonical" href="https://juvay.app/" />

  <!-- Geo targeting: Caribbean-wide, T&T primary market -->
  <meta name="geo.region" content="TT" />
  <meta name="geo.placename" content="Trinidad and Tobago, Caribbean" />

  <!-- Open Graph (Facebook, WhatsApp link previews) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Juvay" />
  <meta property="og:title" content="Juvay — Caribbean Commerce Platform" />
  <meta property="og:description" content="Build your free online store, get cash-on-delivery orders, book rides, and find jobs — all built for the Caribbean." />
  <meta property="og:image" content="https://juvay.app/juvay-logo.png" />
  <meta property="og:url" content="https://juvay.app/" />
  <meta property="og:locale" content="en_TT" />

  <!-- Twitter/X Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Juvay — Caribbean Commerce Platform" />
  <meta name="twitter:description" content="Build your free online store, get cash-on-delivery orders, book rides, and find jobs — all built for the Caribbean." />
  <meta name="twitter:image" content="https://juvay.app/juvay-logo.png" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/juvay-logo.png" />
  <link rel="apple-touch-icon" href="/juvay-logo.png" />

  <title>Juvay — Caribbean Commerce Platform</title>
  <link rel="stylesheet" href="/index.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <!-- Organization structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Juvay",
    "url": "https://juvay.app",
    "logo": "https://juvay.app/juvay-logo.png",
    "description": "Caribbean commerce platform for stores, rides, jobs, real estate, and events.",
    "areaServed": ["Trinidad and Tobago","Jamaica","Barbados","Guyana","St. Lucia","Grenada","St. Vincent and the Grenadines","Antigua and Barbuda","Dominica","St. Kitts and Nevis","The Bahamas","Belize"]
  }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
